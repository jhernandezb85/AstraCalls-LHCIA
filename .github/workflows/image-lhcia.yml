name: Imagen LHCIA (GHCR, amd64)

# Imagen propia del fork para producción: solo linux/amd64 (el servidor es x86),
# construida en GitHub Actions (nunca en el VPS) y publicada en GitHub Container
# Registry. Se dispara con cada push a la rama `lhcia`, con cada etiqueta de
# versión `vX.Y.Z-lhcia.N` o a mano.
#
#   ghcr.io/<dueño>/astracalls:lhcia              -> última versión de la rama (pruebas)
#   ghcr.io/<dueño>/astracalls:latest             -> última versión publicada (producción)
#   ghcr.io/<dueño>/astracalls:v1.1.6-lhcia.1     -> versión fija (histórico / volver atrás)
#   ghcr.io/<dueño>/astracalls:lhcia-<sha7>       -> versión fija por commit
#
# Versiones: vX.Y.Z = versión oficial de AstraCalls en la que se basa; -lhcia.N =
# revisión propia. Ver CHANGELOG-LHCIA.md.
#
# No usa secretos extra: publica con el GITHUB_TOKEN del propio repositorio.

on:
  push:
    branches: [lhcia]
    tags: ['v*-lhcia.*']
  workflow_dispatch:

concurrency:
  group: image-lhcia-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: pruebas (Go, sin cgo)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./cmd/server
      - run: go test ./cmd/server

  image:
    name: imagen amd64
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/astracalls
          tags: |
            type=raw,value=lhcia,enable=${{ github.ref == 'refs/heads/lhcia' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=lhcia-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'lhcia' }}
            BUILD_REV=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
